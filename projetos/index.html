</head>

<body class="bg-fundo text-white">

    <header class="fixed z-500 inset-x-0 top-0 h-15 bg-fundo/80 backdrop-blur-xl border-b border-borda">
        <div class="interface flex items-center justify-between h-full gap-5">

            <a class="logo" href="/">
                <span class="marca">W</span>
                <p>W.Ribeiro<em>/</em>Full Stack</p>
            </a>

            <a class="btn-contorno !py-2" href="/">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>
    </header>

    <section class="reveal pt-15">
        <div class="interface flex flex-col lg:flex-row lg:items-end justify-between gap-8 py-16 lg:py-20">
            <div class="flex flex-col gap-5">
                <p class="font-jetbrains text-xs text-cinza">~/ arquivos / <span class="text-principal">projetos</span></p>
                <h1 class="text-5xl sm:text-6xl lg:text-8xl font-bold uppercase tracking-tight leading-[0.9]">
                    Tudo que eu <br>
                    <span class="text-principal">construí.</span>
                </h1>
            </div>

            <p class="text-white/70 leading-relaxed lg:max-w-sm">
                Sistemas em produção, sites para clientes, jogos, automações com IA e infraestrutura caseira. Clique em
                um projeto para ver os detalhes.
            </p>
        </div>
    </section>

    <section class="reveal delay-100 pb-20 lg:pb-28">
        <div id="categorias" class="sticky top-15 z-400 bg-fundo/80 backdrop-blur-xl border-y border-borda">
            <div class="interface flex flex-wrap items-center justify-between gap-5 py-4">
                <div class="btn-container flex flex-wrap gap-2">
                    <!-- preenchido dinamicamente pelo JS -->
                </div>

                <p id="contador-itens" class="font-jetbrains text-xs text-cinza uppercase tracking-wider">0 / ITENS</p>
            </div>
        </div>

        <div class="interface pt-8">
            <div id="container-projetos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- preenchido pelo JS -->
            </div>
        </div>
    </section>

    <footer class="border-t border-borda py-6">
        <div class="interface flex flex-col md:flex-row items-center justify-between gap-5">
            <p class="font-jetbrains text-[11px] text-cinza uppercase tracking-widest">© <span id="ano"></span> Walysson Ribeiro Rosa</p>
            <a class="btn-principal" href="/#contato">Tem um projeto? Fale comigo</a>
        </div>
    </footer>

    <!-- Modal -->
    <div id="modal-projeto"
        class="hidden fixed inset-0 z-[999] bg-black/80 backdrop-blur-sm items-center justify-center p-3 lg:p-5">
        <div class="relative bg-card border border-borda max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <button onclick="fecharModal()"
                class="absolute top-4 right-4 flex items-center justify-center size-10 bg-fundo border border-borda text-white hover:border-principal hover:text-principal text-lg z-10 cursor-pointer"
                aria-label="Fechar">
                <i class="bi bi-x-lg"></i>
            </button>

            <div id="modal-conteudo">
                <!-- preenchido pelo JS -->
            </div>
        </div>
    </div>

    <script src="/js/projetos.js"></script>
    <script>
        // pegando o ano atual
        document.getElementById('ano').textContent = new Date().getFullYear();

        // animação reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.01,           // Dispara assim que 1% do topo entrar na tela
            rootMargin: "0px 0px -50px 0px" // Dá um respiro sutil de 50px antes de acionar
        });

        document.querySelectorAll('.reveal').forEach(section => {
            observer.observe(section);
        });
    </script>
