<body class="bg-fundo text-white">

    <header class="fixed z-500 inset-0 bg-fundo/70 backdrop-blur-xl h-15 p-2 shadow-lg/30 border-b border-borda">
        <div class="interface flex items-center justify-between h-full gap-5">

            </div>

            <nav class="flex items-center justify-center gap-5 font-jetbrains font-light text-xs text-cinza">
                <a class="hover:text-principal" href="/">[ <i class="bi bi-arrow-left"></i> VOLTAR ]</a>
            </nav>
        </div>
    </header>

    <section class="reveal pt-15">
        <div class="interface flex flex-col gap-5">
            <p class="text-principal text-xs uppercase">arquivos / projetos</p>
            <h2 class="text-5xl lg:text-7xl font-semibold uppercase">Tudo que eu construí</h2>
            <p class="text-lg text-cinza lg:w-1/2">
                Sistemas em produção, sites para clientes, jogos, automações com IA e infraestrutura caseira. Clique em
                um projeto para ver os detalhes.
            </p>
        </div>
    </section>

    <section class="reveal delay-100">
        <div class="interface border-t border-borda pt-10">
            <div id="categorias" class="flex flex-wrap items-center justify-between gap-5 mb-10">
                <div class="btn-container flex flex-wrap gap-2">
                    <!-- preenchido dinamicamente pelo JS -->
                </div>

                <p id="contador-itens" class="text-xs text-cinza font-jetbrains uppercase">0 / ITENS</p>
            </div>

            <div id="container-projetos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 bg-borda gap-[1.5px]">
                <!-- preenchido pelo JS -->
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div id="modal-projeto"
        class="hidden fixed inset-0 z-[999] bg-black/80 backdrop-blur-sm items-center justify-center p-3 lg:p-5">
        <div class="relative bg-fundo border border-borda max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <button onclick="fecharModal()"
                class="absolute top-4 right-4 text-cinza hover:text-white text-2xl z-10 cursor-pointer">
                <i class="bi bi-x-lg"></i>
            </button>

            <div id="modal-conteudo">
                <!-- preenchido pelo JS -->
            </div>
        </div>
    </div>

    <script src="/js/projetos-page.js"></script>
    <script>
        // animação reveal
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            threshold: 0.01,           // Dispara assim que 1% do topo entrar na tela
            rootMargin: "0px 0px -50px 0px" // Dá um respiro sutil de 50px antes de acionar
        });

        document.querySelectorAll('.reveal').forEach(section => {
            observer.observe(section);
        });
    </script>
